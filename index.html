<style>
/* Layout: colonna unica da telefono (max 720px), barra di navigazione fissa in basso, una schermata per azione */
:root {
  --bg: #f3f5f0;
  --surface: #ffffff;

  --bad-soft: #f8e4e1;
  --chip: #eceff0;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
  /* colori delle tre aree */
  --a-ordini: #2c6a4c; --a-ordini-soft: #d9eadf; --a-ordini-bg: #eaf3ec;
  --a-conti: #8f5a12; --a-conti-soft: #f3e1c4; --a-conti-bg: #fbf2e4;
  --a-gest: #2f5d8f; --a-gest-soft: #d8e4f3; --a-gest-bg: #e9eff8;
  --area: var(--a-ordini); --area-soft: var(--a-ordini-soft);
}

    --accent: #6fbf94; --accent-ink: #0d1a12; --accent-soft: #22382c;
    --due: #f0b35a; --due-soft: #3a2c16; --ok: #7fcf92; --ok-soft: #1f3424; --bad: #f08a80; --bad-soft: #3d201d;
    --chip: #263029; color-scheme: dark;
    --a-ordini: #7fcf9c; --a-ordini-soft: #22382c; --a-ordini-bg: #111a14;
    --a-conti: #f0b866; --a-conti-soft: #3d2e17; --a-conti-bg: #1c160e;
    --a-gest: #8cb6ea; --a-gest-soft: #1f2e44; --a-gest-bg: #10161f;
  }
}

  --bg: #121714; --surface: #1b221e; --ink: #e8eee9; --muted: #a2afa6; --line: #2f3a33;
  --accent: #6fbf94; --accent-ink: #0d1a12; --accent-soft: #22382c;
  --due: #f0b35a; --due-soft: #3a2c16; --ok: #7fcf92; --ok-soft: #1f3424; --bad: #f08a80; --bad-soft: #3d201d;
  --chip: #263029; color-scheme: dark;
  --a-ordini: #7fcf9c; --a-ordini-soft: #22382c; --a-ordini-bg: #111a14;
    --a-conti: #f0b866; --a-conti-soft: #3d2e17; --a-conti-bg: #1c160e;
    --a-gest: #8cb6ea; --a-gest-soft: #1f2e44; --a-gest-bg: #10161f;
}
body[data-area="ordini"] { --bg: var(--a-ordini-bg); --area: var(--a-ordini); --area-soft: var(--a-ordini-soft); }
body[data-area="conti"] { --bg: var(--a-conti-bg); --area: var(--a-conti); --area-soft: var(--a-conti-soft); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 18px; line-height: 1.45;
}
.app { max-width: 720px; margin: 0 auto; padding: 0 16px 120px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 1.3rem; font-weight: 600; }
h3 { font-size: 1.05rem; font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 22px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1 1 auto; min-width: 0; }

.top { padding-block: 22px 14px; display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.back { background: none; border: 0; color: var(--accent); font: inherit; font-weight: 700; padding: 8px 0; cursor: pointer; align-self: flex-start; min-height: 44px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.tap { cursor: pointer; }
.card.tap:hover { border-color: var(--accent); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 8px; }

.btn {
  font: inherit; font-weight: 700; border-radius: 12px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  min-height: 52px; padding: 10px 18px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; text-align: center;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn.quiet { background: var(--chip); color: var(--ink); border-color: transparent; }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }

.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .chip:focus-visible, .step:focus-visible, .seg button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--chip); color: var(--ink); white-space: nowrap; }
.pill.aperto { background: var(--ok-soft); color: var(--ok); }

.pill.consegnato { background: var(--accent-soft); color: var(--accent); }
.pill.bozza, .pill.archiviato { background: var(--chip); color: var(--muted); }
.pill.due { background: var(--due-soft); color: var(--due); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font: inherit; font-size: 0.95rem; border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 99px; padding: 8px 14px; min-height: 44px; cursor: pointer; }
label.chip { display: inline-flex; align-items: center; position: relative; }
label.chip:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 700; }

label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 0.95rem; }
label.f .hint { font-weight: 400; color: var(--muted); font-size: 0.85rem; }
input[type=text], input[type=password], input[type=number], input[type=date], input[type=tel], input[type=search], select, textarea {
  font: inherit; font-weight: 400; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 48px; width: 100%;
}
textarea { min-height: 120px; resize: vertical; }
.check { display: flex; gap: 10px; align-items: center; font-weight: 400; cursor: pointer; min-height: 44px; }
.check input { width: 24px; height: 24px; accent-color: var(--accent); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }

/* prodotti da ordinare */
.cat { font-family: var(--f-display); font-weight: 600; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding-top: 10px; }
.prod { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.prod.has { border-color: var(--accent); background: linear-gradient(var(--accent-soft), var(--accent-soft)) top / 100% 4px no-repeat, var(--surface); }
.prod.off { opacity: 0.55; }
/* vista compatta: più prodotti per schermata */
.compatta .prod { padding: 8px 12px; gap: 6px; border-radius: 10px; }
.compatta .prod .nome { font-size: 0.97rem; line-height: 1.25; }
.compatta .prod .small { font-size: 0.8rem; }
.compatta .step { width: 40px; height: 40px; font-size: 1.25rem; }
.compatta .stepper { border-width: 1px; border-radius: 10px; }
.compatta .stepper input { width: 44px; min-height: 40px; font-size: 1.05rem; }
.compatta .cat { padding-top: 4px; font-size: 0.85rem; }
.compatta #lista { gap: 6px; }
.varianti { display: flex; flex-direction: column; gap: 10px; }
.compatta .varianti { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 4px 16px; }
.compatta .varianti .nota-v { grid-column: 1 / -1; }
.compatta .varianti .nota-v input { min-height: 36px !important; }
.compatta .qty-line { gap: 8px; flex-wrap: nowrap; }
.compatta .var-name { font-size: 0.95rem; font-weight: 600; }
.compatta .varianti .step { width: 36px; height: 36px; }
.compatta .varianti .stepper input { min-height: 36px; width: 42px; }
.riga1-in { display: flex; align-items: center; gap: 10px; }
.riga1-in .grow { flex: 1; min-width: 0; }
.riga1-in .prezzo { text-align: right; white-space: nowrap; font-size: 0.95rem; }
.riga1-in .prezzo .small { font-weight: 400; }
.vista-sw .chip { padding: 6px 12px; min-height: 36px; font-size: 0.85rem; }
@media (min-width: 1000px) {
  body.compatta[data-view="ordina"] .app { max-width: 1100px; }
  body.compatta #lista { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: start; }
  body.compatta #lista .cat, body.compatta #lista .empty { grid-column: 1 / -1; }
}
.prod .nome { font-weight: 700; }
.prod .prezzo { font-weight: 700; }
.qty-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.stepper { display: inline-flex; align-items: center; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.step { font: inherit; font-size: 1.5rem; font-weight: 700; width: 52px; height: 52px; border: 0; background: var(--chip); color: var(--ink); cursor: pointer; }
.step.plus { background: var(--accent); color: var(--accent-ink); }
.stepper input { width: 64px; min-height: 52px; border: 0; border-radius: 0; text-align: center; font-weight: 700; font-size: 1.2rem; padding: 0; }
.var-name { font-weight: 700; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
}
.bar-in { max-width: 720px; margin: 0 auto; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.nav { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; max-width: 720px; margin: 0 auto; }
.nav button { font: inherit; font-size: 0.92rem; font-weight: 700; background: none; border: 0; color: var(--muted); padding: 6px 4px; min-height: 52px; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.nav button.on { color: var(--area); background: var(--area-soft); }
.nav button[data-nav="ordini"] { --area: var(--a-ordini); --area-soft: var(--a-ordini-soft); }
.nav button[data-nav="conti"] { --area: var(--a-conti); --area-soft: var(--a-conti-soft); }
.nav button[data-nav="gestione"] { --area: var(--a-gest); --area-soft: var(--a-gest-soft); }
.top .eyebrow { color: var(--area); }
body { transition: background-color .2s; }
@media (prefers-reduced-motion: reduce) { body { transition: none; } }
.nav svg { width: 24px; height: 24px; }

.total-big { font-family: var(--f-display); font-weight: 800; font-size: 1.5rem; }
.saldo { border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 4px; }
.saldo.due { background: var(--due-soft); color: var(--due); }
.saldo.ok { background: var(--ok-soft); color: var(--ok); }
.saldo .cifra { font-family: var(--f-display); font-weight: 800; font-size: 2.6rem; line-height: 1; }
.saldo .lab { font-weight: 700; }

.list { display: flex; flex-direction: column; }
.li { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; padding-block: 12px; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
.li .amt { font-weight: 700; white-space: nowrap; }

.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.tabs button { font: inherit; font-weight: 700; font-size: 0.95rem; white-space: nowrap; border: 0; background: var(--chip); color: var(--ink); padding: 10px 14px; border-radius: 99px; min-height: 44px; cursor: pointer; }
.tabs button.on { background: var(--ink); color: var(--bg); }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { font: inherit; font-size: 0.92rem; font-weight: 700; border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 12px; min-height: 44px; cursor: pointer; }
.seg button.on { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.seg button.on.no { border-color: var(--due); background: var(--due-soft); color: var(--due); }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }

.notice { border-radius: 12px; padding: 12px 14px; background: var(--accent-soft); }
.notice.warn { background: var(--due-soft); color: var(--due); }
.notice.err { background: var(--bad-soft); color: var(--bad); }
.cam-ov { position: fixed; left: 0; right: 0; top: 0; max-height: 100%; max-height: 100dvh; overflow-y: auto; z-index: 50; background: #101412; color: #f4f1ea; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.cam-top { display: flex; align-items: center; gap: 10px; max-width: 480px; margin: 0 auto; width: 100%; }
.cam-top .grow { flex: 1; min-width: 0; }

.cam-info { font-size: 1.05rem; display: flex; flex-direction: column; gap: 6px; max-width: 480px; margin: 0 auto; width: 100%; }
.cam-msg { font-weight: 700; font-size: 1.15rem; }
.cam-ov.lampo-ok { animation: lampoOk .6s ease-out; }
.cam-ov.lampo-no { animation: lampoNo .9s ease-out; }
@keyframes lampoOk { 0% { background: #2e9e5b; } 100% { background: #101412; } }
@keyframes lampoNo { 0%, 40% { background: #c9731f; } 100% { background: #101412; } }
.cam-msg.warn { color: #ffb86b; }
#tema { position: absolute; left: 0; right: 0; top: 0; height: 150px; pointer-events: none; z-index: 0; background-repeat: repeat-x; background-position: top center; opacity: .5;
  -webkit-mask-image: linear-gradient(#000 35%, transparent), linear-gradient(to right, transparent 10%, #000 55%);
  -webkit-mask-composite: source-in; mask-image: linear-gradient(#000 35%, transparent), linear-gradient(to right, transparent 10%, #000 55%); mask-composite: intersect; }
@media (min-width: 760px) { #tema { -webkit-mask-image: linear-gradient(#000 35%, transparent); -webkit-mask-composite: source-over; mask-image: linear-gradient(#000 35%, transparent); mask-composite: add; } }
.app { position: relative; z-index: 1; }
/* ai lati della pagina: fuori dalla colonna dei contenuti (sul telefono una striscia sottile) */
#tema-lati { position: fixed; inset: 0; pointer-events: none; z-index: 0; background-repeat: repeat; background-size: 240px 120px; opacity: .4;
  --lato: max(14px, calc((100vw - 760px) / 2));
  -webkit-mask-image: linear-gradient(to right, #000 0, #000 calc(var(--lato) - 24px), transparent var(--lato), transparent calc(100% - var(--lato)), #000 calc(100% - var(--lato) + 24px), #000 100%);
  mask-image: linear-gradient(to right, #000 0, #000 calc(var(--lato) - 24px), transparent var(--lato), transparent calc(100% - var(--lato)), #000 calc(100% - var(--lato) + 24px), #000 100%); }
body.compatta[data-view="ordina"] #tema-lati { --lato: max(14px, calc((100vw - 1140px) / 2)); }
/* sul telefono i margini sono stretti: lo sfondo si vede, molto tenue, nei bordi e fra un riquadro e l'altro */
@media (max-width: 759px) { #tema-lati { opacity: .16; background-size: 180px 90px; -webkit-mask-image: none; mask-image: none; } }
@media (prefers-color-scheme: dark) { #tema { opacity: .3; } #tema-lati { opacity: .22; } }
select.da-scegliere { border-color: var(--due); box-shadow: 0 0 0 2px var(--due-soft); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 700; z-index: 30; max-width: calc(100% - 32px); text-align: center; }
.saving { font-size: 0.85rem; color: var(--muted); }
.empty { text-align: center; padding: 30px 10px; color: var(--muted); }
.loading { padding: 60px 0; text-align: center; color: var(--muted); }
details > summary { cursor: pointer; font-weight: 700; color: var(--accent); min-height: 40px; display: flex; align-items: center; }
.demo-bar { background: var(--ink); color: var(--bg); font-size: 0.9rem; padding: 8px 16px; }
.demo-bar .in { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.demo-bar select { min-height: 38px; width: auto; padding: 4px 8px; font-size: 0.9rem; }
.demo-bar .demo-reset { font: inherit; font-size: 0.85rem; font-weight: 700; background: transparent; color: var(--bg); border: 1px solid var(--bg); border-radius: 8px; padding: 6px 10px; min-height: 38px; cursor: pointer; }
.demo-bar .demo-nota { font-size: 0.8rem; opacity: 0.85; margin-top: 4px; }
@media (prefers-reduced-motion: no-preference) { .card.tap, .btn, .chip { transition: border-color .15s, background .15s; } }

  /* ========== eventi ========== */
  function salvaDati() {
    var g = function (id) { var el = document.getElementById(id); return el ? el.value : undefined; };
    var d = { id: S.data.nuovo ? '' : S.data.ordine.id, fornitore_id: g('o-forn'), titolo: g('o-titolo'), fornitore: g('o-fornitore'), chiusura: g('o-chiusura'), consegna: g('o-consegna'), pagamento: g('o-pag'), sconti: g('o-sconti'), note: g('o-note'), referente_id: g('o-ref') };
    call('salvaOrdine', d).then(function (r) {
      toast('Salvato');
      var nuovo = S.data.nuovo;
      S.p = { id: r.id, tab: nuovo ? 'prodotti' : 'dati' }; carica();
    }, function (e) { toast(errMsg(e)); });
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button, [data-ordine], [data-gordine], a');
    if (!t) return;
    var ds = t.dataset, act = ds.act;

    if (ds.demochi) { if (window.DEMO_SCEGLI) window.DEMO_SCEGLI(ds.demochi); avvia(ds.demochi); return; }
    if (ds.nav) { radice(ds.nav); return; }
    if (ds.ordine) { S.perConto = ''; vai('ordina', { id: ds.ordine }); return; }
    if (ds.gordine) { vai('gOrdine', { id: ds.gordine }); return; }
    if (ds.step) { var inp = t.parentNode.querySelector('input'); cambiaQta(ds.p, ds.v || '', (Number(inp.value) || 0) + Number(ds.step)); return; }
    if (ds.per !== undefined && t.classList.contains('chip')) { S.perConto = ds.per; disegna(); return; }
    if (ds.vista) { try { localStorage.setItem('gas_vista', ds.vista); } catch (e) {} disegna(); return; }
    if (ds.tab) { S.p.tab = ds.tab; S.conferma = ''; disegna(); return; }
    if (ds.pztogli) {
      call('togliPezzo', S.data.ordine.id, ds.pztogli).then(function (r) { aggiornaPesata(r); disegna(); toast('Pezzo tolto'); }, function (e) { toast(errMsg(e)); });
      return;
    }
    if (ds.stato) {
      var st = ds.stato, o = S.data.ordine;
      if (st === '__elimina') {
        if (S.conferma !== 'elimina') { S.conferma = 'elimina'; disegna(); return; }
        call('eliminaOrdine', o.id).then(function () { toast('Bozza eliminata'); torna(); }, function (e) { toast(errMsg(e)); });
        return;
      }
      if (st === 'chiuso' && S.conferma !== 'chiuso') { S.conferma = 'chiuso'; disegna(); return; }
      if (S.prodDirty) { toast('Prima salva i prodotti'); return; }
      call('statoOrdine', o.id, st).then(function () { toast('Ordine ' + (NOMI_STATO[st] || st).toLowerCase()); S.conferma = ''; carica(); }, function (e) { toast(errMsg(e)); });
      return;
    }
    if (ds.paga !== undefined) {
      var p = S.data.paganti[+ds.paga], m = ds.metodo;
      call('salvaEsito', { ordine_id: S.data.ordine.id, socio_id: p.socio_id, per_conto: p.per_conto, pagato: !!m, metodo: m }).then(function (r) {
        S.data.paganti = r.paganti; disegna(); toast(m ? 'Pagato con ' + m.toLowerCase() : 'Segnato come non pagato');
      }, function (e) { toast(errMsg(e)); });
      return;
    }
    if (ds.copialink) { var tx = document.getElementById('link-' + ds.copialink); copia(tx.value, 'link-' + ds.copialink); return; }
    if (ds.nuovolink) {
      if (S.conferma !== 'link-' + ds.nuovolink) { S.conferma = 'link-' + ds.nuovolink; disegna(); return; }
      call('salvaSocio', { id: ds.nuovolink, nuovo_codice: true }).then(function (r) { S.data = r; S.conferma = ''; disegna(); toast('Nuovo link creato'); }, function (e) { toast(errMsg(e)); });
      return;
    }
    if (ds.copiaiban) { copia(ds.copiaiban); return; }
    if (ds.ordinedaforn) { vai('gOrdine', { tab: 'dati', fornitore: ds.ordinedaforn }); return; }
    if (ds.salvaforn !== undefined) {
      var pre = ds.salvaforn ? 'f' + ds.salvaforn + '-' : 'fn-';
      var gv = function (k) { var el = document.getElementById(pre + k); return el ? el.value : undefined; };
      var box = document.getElementById(pre + 'altri');
      var altri = box ? Array.prototype.map.call(box.querySelectorAll('input:checked'), function (x) { return x.value; }) : undefined;
      call('salvaFornitore', { id: ds.salvaforn, altri_referenti: altri, nome: gv('nome'), vende: gv('vende'), referente_id: gv('ref'), contatto: gv('contatto'), pagamento: gv('pag'), sconti: gv('sconti'), iban: gv('iban'), note: gv('note') })
        .then(function (r) { S.data.fornitori = r; disegna(); toast(ds.salvaforn ? 'Fornitore salvato' : 'Fornitore aggiunto'); }, function (e) { toast(errMsg(e)); });
      return;
    }
    if (ds.attivaforn) { call('salvaFornitore', { id: ds.attivaforn, attivo: ds.val === '1' }).then(function (r) { S.data.fornitori = r; disegna(); }, function (e) { toast(errMsg(e)); }); return; }
    if (ds.azzerapin) { call('salvaSocio', { id: ds.azzerapin, azzera_pin: true }).then(function (r) { S.data = r; disegna(); toast('PIN azzerato: il socio può sceglierne uno nuovo'); }, function (e) { toast(errMsg(e)); }); return; }
    if (ds.attiva) { call('salvaSocio', { id: ds.attiva, attivo: ds.val === '1' }).then(function (r) { S.data = r; disegna(); }, function (e) { toast(errMsg(e)); }); return; }

    switch (act) {
      case 'back': torna(); break;
      case 'esci': memTogli(); S.codice = ''; S.boot = null; S.stack = []; vAccesso(''); break;
      case 'entra-pin':
        var sid = document.getElementById('pin-nome').value, pv = document.getElementById('pin-in').value.trim();
        if (!sid) { toast('Scegli il tuo nome'); break; }
        if (!pv) { toast('Scrivi il tuo PIN'); break; }
        S.codice = '';
        call('entraConPin', sid, pv).then(function (r) { avvia(r.codice); }, function (e) { vAccesso(errMsg(e)); });
        break;
      case 'salva-pin':
        var p1 = document.getElementById('pin-nuovo').value.trim(), p2 = document.getElementById('pin-ripeti').value.trim();
        if (p1 !== p2) { toast('I due PIN non coincidono'); break; }
        call('impostaPin', p1).then(function () { S.boot.me.ha_pin = true; toast('PIN salvato'); disegna(); }, function (e) { toast(errMsg(e)); });
        break;
      case 'entra':
        var c = (document.getElementById('codice-in').value || '').trim().toUpperCase();
        if (c) avvia(c);
        break;
      case 'altra-persona': var a = document.getElementById('altra'); a.hidden = false; document.getElementById('altra-nome').focus(); break;
      case 'altra-ok': var n = document.getElementById('altra-nome').value.trim(); if (n) { S.perConto = n; disegna(); } break;
      case 'nuovo-ordine': vai('gOrdine', { tab: 'dati' }); break;
      case 'soci': vai('soci', {}); break;
      case 'fornitori': vai('fornitori', {}); break;
      case 'duplica': call('duplicaOrdine', S.data.ordine.id).then(function (r) { toast('Copia creata in bozza'); vai('gOrdine', { id: r.id, tab: 'dati' }, true); }, function (e) { toast(errMsg(e)); }); break;
      case 'salva-dati': salvaDati(); break;
      case 'p-nuovo': S.prodEdit.push({ nome: '', categoria: '', formato: '', unita: 'pz', qta_conf: 1, prezzo: 0, varianti: '', peso_variabile: false, disponibile: true }); S.prodDirty = true; disegna(); break;
      case 'p-togli': S.prodEdit.splice(+ds.i, 1); S.prodDirty = true; disegna(); break;
      case 'p-salva':
        call('salvaProdotti', S.data.ordine.id, S.prodEdit).then(function (r) { var soci = S.data.soci, forn = S.data.fornitori; S.data = r; S.data.soci = soci; S.data.fornitori = forn; prepProdotti(); disegna(); toast('Prodotti salvati'); }, function (e) { toast(errMsg(e)); });
        break;
      case 'imp-apri': S.imp = {}; disegna(); break;
      case 'imp-chiudi': S.imp = null; disegna(); break;
      case 'imp-leggi':
        var righe = leggiIncollato(document.getElementById('imp-testo').value);
        if (!righe.length) { toast('Incolla prima le righe del foglio'); break; }
        preparaImport(righe, null); disegna(); break;
      case 'imp-link':
        var link = document.getElementById('imp-link').value.trim();
        if (!link) { toast('Incolla prima il link del foglio'); break; }
        leggiDaLink(link, ''); break;
      case 'imp-ok':
        var nuovi = estraiImport();
        if (!nuovi.length) { toast('Nessun prodotto valido: controlla le colonne di nome e prezzo'); break; }
        var colQ = S.imp.conQta === false ? [] : colonneSoci(S.imp, nuovi);
        // un prodotto già presente (stesso nome e confezione) viene aggiornato, non duplicato
        var chiaveP = function (p) { return normNome(p.nome) + '|' + normNome(p.formato); };
        var esistenti = {};
        S.prodEdit.forEach(function (p) { if (p.id) (esistenti[chiaveP(p)] = esistenti[chiaveP(p)] || []).push(p); });
        var aggiornati = 0, aggiunti = [];
        nuovi.forEach(function (p) {
          var e = (esistenti[chiaveP(p)] || []).shift();
          if (e) { ['categoria', 'unita', 'qta_conf', 'prezzo', 'varianti'].forEach(function (k) { e[k] = p[k]; }); if (p.peso_variabile) e.peso_variabile = true; p.id = e.id; aggiornati++; }
          else { p.id = 'n' + Math.random().toString(36).slice(2, 11); aggiunti.push(p); }
        });
        var daImp = righeImport(nuovi, colQ).map(function (x) {
          return { prodotto_id: nuovi[x.pi].id, socio_id: x.socio_id, per_conto: x.per_conto, variante: x.variante, quantita: x.quantita, note: x.note };
        });
        nuovi.forEach(function (p) { delete p.riga; });
        S.prodEdit = S.prodEdit.concat(aggiunti); S.imp = null;
        var oid = S.data.ordine.id;
        call('salvaProdotti', oid, S.prodEdit).then(function (r) {
          return daImp.length ? call('importaRighe', oid, daImp) : r;
        }).then(function (r) {
          var soci = S.data.soci, forn = S.data.fornitori; S.data = r; S.data.soci = soci; S.data.fornitori = forn; prepProdotti(); disegna();
          toast((aggiunti.length ? aggiunti.length + ' prodotti nuovi' : '') + (aggiunti.length && aggiornati ? ', ' : '') + (aggiornati ? aggiornati + ' aggiornati' : '') +
            (daImp.length ? ' · ' + (r.importate || daImp.length) + ' righe dei soci caricate' : ''));
        }, function (e) { S.prodDirty = true; disegna(); toast(errMsg(e)); });
        break;
      case 'segnala-apri': S.segnala = true; disegna(); var st0 = document.getElementById('segnala-testo'); if (st0) st0.focus(); break;
      case 'segnala-chiudi': S.segnala = false; disegna(); break;
      case 'segnala-invia':
        var tx = (document.getElementById('segnala-testo').value || '').trim();
        if (!tx) { toast('Scrivi in poche parole cosa non va'); break; }
        t.disabled = true;
        call('segnala', { testo: tx, info: infoTecniche() }).then(function (r) {
          S.segnala = false; disegna(); toast(r.inviata ? 'Segnalazione inviata, grazie!' : 'Segnalazione salvata, grazie!');
        }, function (e) { t.disabled = false; toast(errMsg(e)); });
        break;
      case 'stato-aggiorna': S.statoApp = null; var sa = document.getElementById('stato-app'); if (sa) sa.outerHTML = statoAppHtml(); caricaStatoApp(); break;
      case 'email-segn-salva':
        call('emailSegnalazioni', document.getElementById('email-segn').value).then(function (r) { S.statoApp = r; toast('Indirizzo salvato'); var el = document.getElementById('stato-app'); if (el) el.outerHTML = statoAppHtml(); }, function (e) { toast(errMsg(e)); });
        break;
      case 'pz-scan': apriCamera(); break;
      case 'pz-chiudi-cam':
        if (S.camHist) history.back(); else { chiudiCamera(); statoPz().doppio = null; disegna(); }
        break;
      case 'pz-add':
        var pzv = numIt(document.getElementById('pz-prezzo').value);

      case 'pz-forza':

      case 'copia-fornitore': copia(document.getElementById('testo-fornitore').value, 'testo-fornitore'); break;

        var i = +ds.i, pp = S.data.paganti[i];
        call('salvaEsito', { ordine_id: S.data.ordine.id, socio_id: pp.socio_id, per_conto: pp.per_conto,

          .then(function (r) { S.data.paganti = r.paganti; disegna(); toast('Importi salvati'); }, function (e) { toast(errMsg(e)); });
        break;

      S.cerca = t.value;
      document.getElementById('lista').innerHTML = listaProdotti();
      return;
    }

  });

  document.addEventListener('change', function (ev) {
    var t = ev.target, ds = t.dataset;
    if (ds.qty !== undefined) { cambiaQta(ds.p, ds.v || '', t.value); return; }
    if (ds.nota !== undefined) { var r = qtaDi(ds.p, ds.v || ''); if (r) cambiaQta(ds.p, ds.v || '', r.quantita, t.value); return; }
    if (ds.pe !== undefined) {
      var p = S.prodEdit[+ds.i];
      if (t.type === 'checkbox') p[ds.pe] = t.checked; else if (ds.pe === 'prezzo' || ds.pe === 'qta_conf') p[ds.pe] = numIt(t.value); else p[ds.pe] = t.value;
      S.prodDirty = true; disegna(); return;
    }
    if (ds.map) { S.imp.mappa[ds.map] = t.value === '' ? '' : +t.value; disegna(); return; }
    if (t.id === 'tema-scelta') { try { localStorage.setItem('gas_tema', t.value); } catch (e) {} applicaTema(); return; }
    if (t.id === 'pz-socio') { statoPz().sel = t.value; statoPz().doppio = null; statoPz().ultimoOk = ''; statoPz().msg = ''; disegna(); return; }
    if (t.id === 'pz-tipo') { statoPz().tipo = t.value; return; }
    if (t.id === 'pz-scontrino') { call('salvaScontrino', S.data.ordine.id, t.value).then(function (r) { aggiornaPesata(r); disegna(); }, function (e) { toast(errMsg(e)); }); return; }
    if (ds.assegna !== undefined) { S.imp.assegna = S.imp.assegna || {}; S.imp.assegna[ds.assegna] = t.value; disegna(); return; }
    if (t.id === 'imp-qta') { S.imp.conQta = t.checked; disegna(); return; }
    if (t.id === 'imp-start') { S.imp.start = +t.value; S.imp.intest = true; applicaStart(); disegna(); return; }
    if (t.id === 'imp-scheda') { leggiDaLink(S.imp.foglio.link, t.value); return; }
    if (t.id === 'imp-intest') { S.imp.intest = t.checked; if (t.checked && !Object.keys(S.imp.mappa).length) S.imp.mappa = indovinaMappa(S.imp.righe[0]); disegna(); return; }
    if (t.id === 'imp-unita') { S.imp.unita = t.value; return; }
    if (ds.consegna !== undefined) {
      var pg = S.data.paganti[+ds.consegna];
      call('salvaEsito', { ordine_id: S.data.ordine.id, socio_id: pg.socio_id, per_conto: pg.per_conto, consegnato: t.checked }).then(function (r) { S.data.paganti = r.paganti; toast(t.checked ? 'Consegnato' : 'Non consegnato'); }, function (e) { toast(errMsg(e)); });
      return;
    }
    if (t.type === 'checkbox' && t.parentNode && t.parentNode.classList.contains('chip')) { t.parentNode.classList.toggle('on', t.checked); return; }
    if (t.id === 'o-forn') { leggiFormOrdine(); applicaFornitore(t.value); disegna(); return; }
    if (ds.ruolo) { call('salvaSocio', { id: ds.ruolo, ruolo: t.value }).then(function (r) { S.data = r; disegna(); toast('Ruolo aggiornato'); }, function (e) { toast(errMsg(e)); disegna(); }); return; }
    if (ds.tel) { call('salvaSocio', { id: ds.tel, telefono: t.value }).then(function (r) { S.data = r; disegna(); toast('Numero salvato'); }, function (e) { toast(errMsg(e)); }); return; }
  });

  /* ========== avvio ========== */
  function avvia(codice) {
    S.codice = codice; attesa();
    call('avvio').then(function (d) {
      memScrivi(codice);
      S.boot = d; S.data = d; S.view = 'ordini'; S.stack = []; disegna(); ping();
    }, function (e) { memTogli(); vAccesso(errMsg(e)); });
  }
  window.GAS_AVVIA = avvia;
  var cod = (CODICE_URL && CODICE_URL.indexOf('<' + '?') < 0 ? CODICE_URL : '') || memLeggi();
  if (window.DEMO_CALL) { /* la demo avvia da sé */ }
  else if (cod) avvia(cod.toUpperCase());
  else vAccesso('');
})();
</script>
